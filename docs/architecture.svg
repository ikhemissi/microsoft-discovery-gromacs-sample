<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Microsoft Discovery GROMACS sample architecture</title>
  <desc id="desc">This repository provisions Microsoft Discovery with Terraform and deploys a GROMACS tool, a Bookshelf knowledge base and a researcher agent with azd. The agent runs simulations with the tool and cites papers from the knowledge base. Both run on supercomputer node pools and use Discovery storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="920" height="460" rx="12" fill="#ffffff"/>

  <!-- Repository -->
  <rect x="20" y="60" width="220" height="330" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="130" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">This repository</text>
  <g font-size="12" fill="#111827">
    <text x="36" y="122"><tspan font-weight="600">infra/</tspan> Terraform</text>
    <text x="36" y="156"><tspan font-weight="600">azure.yaml</tspan> azd services</text>
    <text x="36" y="190"><tspan font-weight="600">tools/gromacs/</tspan> tool image</text>
    <text x="36" y="224"><tspan font-weight="600">experiments/</tspan> MDP protocol</text>
    <text x="36" y="258"><tspan font-weight="600">agents/</tspan> agent definition</text>
    <text x="36" y="292"><tspan font-weight="600">knowledge/</tspan> research papers</text>
  </g>
  <text x="130" y="340" text-anchor="middle" font-size="11" fill="#4b5563">azd + Discovery extension</text>
  <text x="130" y="356" text-anchor="middle" font-size="11" fill="#4b5563">Terraform state in Blob Storage</text>

  <!-- Repository to Discovery -->
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="285" y="140">azd provision</text>
    <text x="285" y="280">azd deploy</text>
  </g>
  <line x1="244" y1="150" x2="324" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="244" y1="290" x2="324" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Discovery -->
  <rect x="330" y="20" width="570" height="420" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="615" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Microsoft Discovery workspace and project</text>

  <rect x="530" y="66" width="170" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="615" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Agent</text>
  <text x="615" y="108" text-anchor="middle" font-size="12" fill="#111827">Lysozyme researcher</text>
  <text x="615" y="125" text-anchor="middle" font-size="12" fill="#4b5563">gpt-5.4 chat model</text>

  <rect x="350" y="190" width="210" height="78" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="455" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Tool</text>
  <text x="455" y="233" text-anchor="middle" font-size="12" fill="#111827">GROMACS container</text>
  <text x="455" y="250" text-anchor="middle" font-size="12" fill="#4b5563">published to Container Registry</text>

  <rect x="680" y="190" width="190" height="78" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="775" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Bookshelf</text>
  <text x="775" y="233" text-anchor="middle" font-size="12" fill="#111827">Knowledge base of</text>
  <text x="775" y="250" text-anchor="middle" font-size="12" fill="#4b5563">lysozyme research papers</text>

  <rect x="360" y="320" width="300" height="90" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="510" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Supercomputer</text>
  <text x="510" y="366" text-anchor="middle" font-size="12" fill="#111827">CPU node pool: simulations</text>
  <text x="510" y="385" text-anchor="middle" font-size="12" fill="#111827">Memory-optimized node pool: indexing</text>

  <rect x="690" y="320" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="780" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Storage</text>
  <text x="780" y="366" text-anchor="middle" font-size="12" fill="#111827">MDP protocol, outputs</text>
  <text x="780" y="385" text-anchor="middle" font-size="12" fill="#111827">and research papers</text>

  <!-- Relationships -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="575" y1="140" x2="480" y2="188" marker-end="url(#arrow)"/>
    <line x1="655" y1="140" x2="750" y2="188" marker-end="url(#arrow)"/>
    <line x1="455" y1="268" x2="455" y2="318" marker-end="url(#arrow)"/>
    <line x1="720" y1="268" x2="640" y2="318" marker-end="url(#arrow)"/>
    <line x1="800" y1="320" x2="800" y2="270" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#374151">
    <text x="520" y="160" text-anchor="end">runs simulations</text>
    <text x="710" y="160">searches and cites</text>
    <text x="463" y="298">runs on</text>
    <text x="672" y="296" text-anchor="end">indexed on</text>
    <text x="808" y="298">papers</text>
  </g>
</svg>
