name: lysozyme-water-cpu
description: Fixed-protocol lysozyme-in-water educational baseline using GROMACS on CPU. Not a validated formulation study.
version: 1.0.0
category: Physics-Based Simulations
license: LGPL-2.1-or-later
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/discovery-lysozyme:discovery-cpu"
    compute:
      min_resources:
        cpu: 2
        ram: "2Gi"
        gpu: 0
        storage: "0Gi"
      max_resources:
        cpu: 2
        ram: "2Gi"
        gpu: 0
        storage: "0Gi"
      infiniband: false
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
code_environments:
  - language: python3
    command: >-
      GROMACS_ACCELERATION=cpu python3 "/{{scriptName}}" > "{{output_directory}}/logs.out" 2>&1
    description: |
      Run only the packaged /opt/lysozyme-water/run.sh via subprocess.run with check=True.
      Mount the complete prepared input bundle directly at /input, read-only.
      Inputs: protein.pdb, source.pdb, run.sh, provenance.txt, SHA256SUMS and five MDP files.
      CLI: bash /opt/lysozyme-water/run.sh PROFILE /input /output/NEW_RUN_NAME SEED 2
      PROFILE is smoke (2 ps per dynamics stage) or run (100 ps per stage).
      Default SEED is 20261008; valid seeds are integers from 1 to 999999999.
      Obtain explicit user confirmation before executing a billable job.
      Do not modify force fields, molecular parameters, durations or warning handling.
      Write to a new output subdirectory on every attempt; never overwrite results.
      Outputs include run-status.txt, logs, provenance, checksums, XVG analyses and trajectories.
      Require subprocess success and run-status.txt equal to completed before reporting success.
      On failure, stop and return relevant logs; do not retry or change the protocol.
      Explain smoke results as technical validation only, not scientific conclusions.
    infra_node: worker