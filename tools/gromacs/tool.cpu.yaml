name: lysozyme-water-cpu
description: Runs a reviewed lysozyme-in-water GROMACS protocol bundle on CPU. Educational baseline, not a validated formulation study.
version: 1.0.0
category: Physics-Based Simulations
license: LGPL-2.1-or-later
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/discovery-lysozyme:discovery-cpu"
    compute:
      min_resources:
        cpu: 2
        ram: "2Gi"
        gpu: 0
        storage: "0Gi"
      max_resources:
        cpu: 2
        ram: "2Gi"
        gpu: 0
        storage: "0Gi"
      infiniband: false
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
code_environments:
  - language: python3
    command: "python3 \"/{{scriptName}}\" > {{output_directory}}/logs.out 2>&1; exit_code=$?; tail -n 100 {{output_directory}}/logs.out; exit $exit_code"
    description: |
      Run only the packaged /opt/lysozyme-water/run.sh via subprocess.run with check=True.
      Mount the attached protocol bundle directly at /input, read-only.
      Bundle: five hand-written MDP files, protein.pdb, source.pdb, provenance.txt and SHA256SUMS.
      CLI: bash /opt/lysozyme-water/run.sh PROFILE /input /output/NEW_RUN_NAME SEED 2
      PROFILE run executes the MDPs as written; smoke shortens each dynamics stage to 2 ps.
      Default SEED is 20261008; valid seeds are integers from 1 to 999999999.
      Obtain explicit user confirmation before executing a billable job.
      Never edit the MDP files; a parameter change needs a new reviewed protocol version.
      Write to a new output subdirectory on every attempt; never overwrite results.
      Outputs include run-status.txt, logs, provenance, checksums, XVG analyses and trajectories.
      Require subprocess success and run-status.txt equal to completed before reporting success.
      On failure, stop and return relevant logs; do not retry or change the protocol.
      Explain smoke results as technical validation only, not scientific conclusions.
    infra_node: worker